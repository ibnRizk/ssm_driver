name: ssm_driver
description: "Team base architecture boilerplate — Clean Architecture + Cubit + GetIt + Dio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1

  # --- Dependency injection ---
  get_it: ^8.0.3

  # --- Networking ---
  dio: ^5.8.0+1
  connectivity_plus: ^7.0.0

  # --- Routing ---
  go_router: ^16.2.4

  # --- Storage ---
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # --- Config ---
  flutter_dotenv: ^5.2.1

  # --- Location & maps ---
  # geolocator also requests the runtime location permission itself.
  geolocator: ^14.0.2
  google_maps_flutter: ^2.18.1

  # --- UI foundation ---
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6
  loading_animation_widget: ^1.3.0
  photo_view: ^0.15.0

  # --- Utils ---
  intl: ^0.20.2
  logger: ^2.0.1
  url_launcher: ^6.3.1
  google_fonts: ^8.2.1
  audioplayers: ^6.8.1
dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# Regenerate after changing the logo: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/images/app_icon.jpeg
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive icons are masked to a circle/squircle; the inset keeps the whole
  # badge (including its outer ring) inside the safe zone.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.jpeg
  adaptive_icon_foreground_inset: 20
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#173C66"

flutter:
  uses-material-design: true

  assets:
    - .env
    - lang/
    - assets/images/
    - assets/icons/
    - assets/sound/

  # Drop your brand font into assets/fonts/ and uncomment.
  # fonts:
  #   - family: AppFont
  #     fonts:
  #       - asset: assets/fonts/AppFont-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/AppFont-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/AppFont-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/AppFont-Bold.ttf
  #         weight: 700
